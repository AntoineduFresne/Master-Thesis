name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap and needs no toolchain, so it runs first. This is not redundant
      # with the axiom audit below: the audit only sees modules reachable from
      # `ARA.lean`, whereas this also catches a `sorry` in a file nobody imports
      # yet.
      - name: No `sorry` in the sources
        run: |
          if grep -rnE '\bsorry' --include='*.lean' ARA ARA.lean; then
            echo "::error::found 'sorry' in the Lean sources (listed above)"
            exit 1
          fi

      - name: Build (elan + lake, mathlib cache)
        uses: leanprover/lean-action@v1

      # Every ARA declaration must rest on `propext`, `Classical.choice` and
      # `Quot.sound` only — the same trusted base as mathlib. Catches finished-
      # looking proofs that secretly use `sorryAx` or `native_decide`.
      - name: Axiom audit
        run: lake exe axiom_audit
